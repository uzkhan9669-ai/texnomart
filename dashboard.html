<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Texnomart HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffc800;--ink:#1c1c1e;--soft:#2c2c2e;--bg:#f4f5f7;--card:#fff;--line:#e4e5ea;--txt:#1c1c1e;--mut:#6b6b74;--green:#1b8a4b;--amber:#b77900;--red:#c93030;--greenbg:#e5f5ec;--amberbg:#fff3d1;--redbg:#fde8e8;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;height:56px;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px;color:#fff;line-height:1}.logo i{font-style:normal;color:var(--y)}.login .logo{color:var(--ink)}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tabs button{background:none;border:0;color:#c9c9cf;font-weight:600;padding:8px 14px;border-radius:8px}
.tabs button.on{background:var(--soft);color:#fff}
.top .out{background:none;border:1px solid #55555c;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px}
.kpi .n{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.3}
.seg{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:#eef0f3}.seg i{display:block;min-width:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px}.lg{display:flex;align-items:center;gap:6px}.lg b{margin-left:2px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
h3.mt{margin-top:20px}
.tip{position:fixed;z-index:30;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap}
.warnbox{background:var(--amberbg);border:1px solid #f0cf7a;color:#5c4300;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.bar{display:grid;grid-template-columns:minmax(110px,42%) 1fr 74px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar .t{height:10px;background:#eef0f3;border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:#2a78d6;border-radius:5px}
.bar b{text-align:right}
.risk{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.risk:last-child{border:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.field{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:150px}
.filters input{flex:1;min-width:220px}
.btn{background:var(--y);border:0;border-radius:9px;padding:9px 14px;font-weight:700}
.btn.alt{background:#fff;border:1px solid var(--line)}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);background:#fafafb}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fffbe6}
.name{font-weight:700}.minor{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef0f3;white-space:nowrap}
.tag.QABUL,.tag.offer,.tag.staj{background:var(--greenbg);color:var(--green)}
.tag.ZAXIRA,.tag.zaxira{background:var(--amberbg);color:var(--amber)}
.tag.RAD,.tag.rad{background:var(--redbg);color:var(--red)}
.pct{font-weight:800;font-size:15px}
.empty{padding:34px;text-align:center;color:var(--mut)}
.login{max-width:380px;margin:9vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
.login h2{margin:14px 0 4px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px}
.login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}
.login .btn{width:100%;margin-top:18px;padding:12px}
.err{color:var(--red);font-weight:600;font-size:13px;min-height:18px;margin-top:10px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:9;overflow:auto;padding:20px;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer .x{float:right;background:none;border:0;font-size:22px;line-height:1;color:var(--mut)}
.who{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.who img,.who .noimg{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#eef0f3;flex:none}
.who h2{margin:0 0 4px;font-size:19px}
.flags div{padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.flags div:last-child{border:0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin:18px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600}
.acts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowf{display:flex;gap:8px}
.rowf input{flex:1}
pre{white-space:pre-wrap;word-break:break-word;background:#fafafb;border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 34px}}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:#eceef2;border-radius:var(--r);padding:10px;min-height:220px}
.col.over,.zone.over{outline:2px dashed #2a78d6;outline-offset:-2px;background:#e3edfb}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}.col h4 span{color:var(--mut)}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;display:grid;grid-template-columns:44px 1fr;gap:10px}
.kc.drag{opacity:.45}
.kc img,.kc .noimg{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#eef0f3}
.kc .name{font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.kc .row2{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.kc .mv{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-weight:700}
.old{color:var(--red);font-weight:700}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zone{border:2px dashed #c9cbd3;border-radius:var(--r);padding:16px;text-align:center;font-weight:700;color:var(--mut);background:#fff}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg .box{background:#fff;border-radius:14px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:17px}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.dlg input[type=text],.dlg input[type=date],.dlg input[type=time],.dlg select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
.dlg .chk{display:flex;gap:8px;align-items:center;margin:14px 0 6px;font-weight:600;color:var(--txt);font-size:14px}
.dlg .msg{background:#f3f8ff;border:1px solid #cfe0f7;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;margin-top:6px}
.dlg .btns{display:flex;gap:8px;margin-top:16px}.dlg .btns .btn{flex:1;padding:11px}
@media(max-width:560px){.top{gap:6px;padding:0 10px}.logo{font-size:17px}.tabs{overflow-x:auto;min-width:0}.tabs button{padding:7px 7px;font-size:13px;white-space:nowrap}.top .out{padding:6px 8px;font-size:13px}main{padding:16px 12px 50px}.zones{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";
var app = document.getElementById("app");
var META = {statuses: {}, verdicts: {}}, page = "overview", filters = {q: "", verdict: "", status: "", pos: "", sort: ""}, timer = null;

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
function api(path, body) {
  var opt = {credentials: "same-origin", headers: {}};
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("auth"); }
      if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
      return j;
    });
  });
}
function logo() { var l = el("span", "logo", "texnomart"); l.appendChild(el("i", null, "*")); return l; }
function toast(t) { Array.prototype.forEach.call(document.querySelectorAll(".toast"), function (x) { x.remove(); }); var e = el("div", "toast", t); document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2200); }
function fmtDate(s) { var d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); }
function tag(code, text) { return el("span", "tag " + code, text); }

// ---------- вход
function showLogin(msg) {
  app.textContent = "";
  var f = el("form", "login");
  add(f, logo(), el("h2", null, "Панель рекрутера"), el("div", "minor", "Войдите, чтобы увидеть кандидатов"));
  var u = el("input"), p = el("input"), err = el("div", "err", msg || ""), b = el("button", "btn", "Войти");
  u.id = "u"; u.autocomplete = "username"; p.id = "p"; p.type = "password"; p.autocomplete = "current-password"; b.type = "submit";
  add(f, el("label", null, "Логин"), u, el("label", null, "Пароль"), p, b, err);
  f.onsubmit = function (e) {
    e.preventDefault(); err.textContent = ""; b.disabled = true;
    api("/api/login", {username: u.value, password: p.value}).then(start).catch(function (x) { err.textContent = x.message; b.disabled = false; });
  };
  app.appendChild(f); u.focus();
}

// ---------- каркас
function shell() {
  app.textContent = "";
  var top = el("div", "top"), tabs = el("div", "tabs"), out = el("button", "out", "Выйти");
  [["overview", "Обзор"], ["board", "Воронка"], ["candidates", "Кандидаты"]].forEach(function (t) {
    var b = el("button", page === t[0] ? "on" : "", t[1]); b.id = "tab-" + t[0];
    b.onclick = function () { page = t[0]; shell(); }; tabs.appendChild(b);
  });
  out.onclick = function () { api("/api/logout", {}).then(function () { showLogin(); }, function () { showLogin(); }); };
  add(top, logo(), tabs, out);
  var main = el("main"); main.id = "main";
  add(app, top, main);
  if (page === "overview") overview(main); else if (page === "board") board(main); else candidates(main);
}

// ---------- обзор
var SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) { var e = document.createElementNS(SVG, tag); Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
function tip(target, text) {   // подсказка при наведении
  target.addEventListener("mousemove", function (ev) {
    var t = document.getElementById("tip") || document.body.appendChild(el("div", "tip")); t.id = "tip"; t.textContent = text;
    t.style.left = Math.min(ev.clientX + 12, window.innerWidth - t.offsetWidth - 8) + "px"; t.style.top = (ev.clientY - 34) + "px";
  });
  target.addEventListener("mouseleave", function () { var t = document.getElementById("tip"); if (t) t.remove(); });
}
function bars(card, pairs, max, fmt) {
  max = Math.max(1, max || Math.max.apply(null, pairs.map(function (p) { return p[1]; })));
  pairs.forEach(function (p) {
    var row = el("div", "bar"), t = el("div", "t"), i = el("i"); i.style.width = Math.round(p[1] / max * 100) + "%";
    t.appendChild(i); add(row, el("span", null, p[0]), t, el("b", null, fmt ? fmt(p[1]) : String(p[1]))); if (p[2]) tip(row, p[2]); card.appendChild(row);
  });
}
function dayChart(card, daily) {   // анкеты по дням: столбцы, одна серия
  var W = 560, H = 190, L = 28, B = 24, T = 14, n = daily.length, max = Math.max(1, Math.max.apply(null, daily.map(function (d) { return d[1]; })));
  var top = max <= 4 ? 4 : Math.ceil(max / 4) * 4, step = (W - L - 6) / n, bw = Math.min(26, step - 4);
  var s = svg("svg", {viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Анкеты по дням за 14 дней"}); s.style.width = "100%"; s.style.display = "block";
  for (var g = 0; g <= 4; g++) {
    var y = T + (H - T - B) * g / 4, v = Math.round(top - top * g / 4);
    s.appendChild(svg("line", {x1: L, x2: W - 4, y1: y, y2: y, stroke: g === 4 ? "#b9bbc4" : "#eceef2", "stroke-width": 1}));
    var tx = svg("text", {x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 10, fill: "#6b6b74"}); tx.textContent = v; s.appendChild(tx);
  }
  daily.forEach(function (d, k) {
    var h = (H - T - B) * d[1] / top, x = L + step * k + (step - bw) / 2, y = H - B - h, dt = new Date(d[0] + "T00:00:00");
    var label = dt.toLocaleDateString("ru-RU", {day: "numeric", month: "short"});
    if (d[1]) s.appendChild(svg("path", {d: "M" + x + " " + (H - B) + "V" + (y + 3) + "q0-3 3-3h" + (bw - 6) + "q3 0 3 3V" + (H - B) + "z", fill: "#2a78d6"}));
    if (k % 2 === (n - 1) % 2) { var t = svg("text", {x: x + bw / 2, y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "#6b6b74"}); t.textContent = dt.getDate() + "." + ("0" + (dt.getMonth() + 1)).slice(-2); s.appendChild(t); }
    var hit = svg("rect", {x: L + step * k, y: T, width: step, height: H - T - B, fill: "transparent"}); tip(hit, label + ": " + d[1]); s.appendChild(hit);
  });
  card.appendChild(s);
}
function verdictBar(card, v, total) {   // доли рекомендаций: одна полоса из трёх частей + подписи
  var parts = [["QABUL", "Принять", "#0ca30c", "✓"], ["ZAXIRA", "Резерв", "#fab219", "●"], ["RAD", "Отказ", "#d03b3b", "✕"]];
  var seg = el("div", "seg"), leg = el("div", "legend");
  parts.forEach(function (p) {
    var n = v[p[0]] || 0, pct = total ? Math.round(n * 100 / total) : 0;
    if (n) { var i = el("i"); i.style.background = p[2]; i.style.flex = n + " 0 0"; tip(i, p[1] + ": " + n + " (" + pct + "%)"); seg.appendChild(i); }
    var item = el("div", "lg"), dot = el("span", "dot", p[3]); dot.style.background = p[2]; if (p[0] === "ZAXIRA") dot.style.color = "#0b0b0b";
    add(item, dot, el("span", null, p[1]), el("b", null, n + " · " + pct + "%")); leg.appendChild(item);
  });
  if (!total) seg.appendChild(el("i"));
  add(card, seg, leg);
}
function overview(main) {
  add(main, el("h1", null, "Обзор подбора"), el("div", "sub", "Данные из базы анкет бота"));
  api("/api/summary").then(function (d) {
    if (!d.storage.persistent) main.appendChild(el("div", "warnbox", "База кандидатов лежит во временном хранилище и обнулится при перезапуске сервера. Подключите в Railway постоянный диск (Volume) с путём /data, тогда данные будут сохраняться."));
    var k = el("div", "kpis");
    [["Всего анкет", d.total, d.storage.persistent ? "база на постоянном диске" : "временное хранилище"],
     ["За 7 дней", d.week, "предыдущие 7 дней: " + d.prev_week],
     ["Средний балл", d.avg + "%", Object.keys(d.pos_avg).map(function (p) { return p + " " + d.pos_avg[p] + "%"; }).join(" · ")],
     ["Дошли до собеседования", d.invited_pct + "%", "доля анкет, дошедших до этапа «Собеседование» и дальше"],
     ["Оффер", d.hired, "кандидатов на этапе «Оффер»"],
     ["С красными флагами", d.red_pct + "%", "доля анкет с серьёзным риском"]].forEach(function (x) {
      var c = el("div", "card kpi"); add(c, el("div", "l", x[0]), el("div", "v", String(x[1])), el("div", "n", x[2] || "")); k.appendChild(c);
    });
    main.appendChild(k);
    var g0 = el("div", "grid2"), a1 = el("div", "card"), a2 = el("div", "card");
    a1.appendChild(el("h3", null, "Анкеты по дням, последние 14 дней")); dayChart(a1, d.daily);
    a2.appendChild(el("h3", null, "Рекомендации системы")); verdictBar(a2, d.verdicts, d.total);
    a2.appendChild(el("h3", "mt", "Распределение по баллу"));
    bars(a2, Object.keys(d.buckets).map(function (b) { return [b + "%", d.buckets[b]]; }), d.total);
    add(g0, a1, a2); main.appendChild(g0);
    var g = el("div", "grid2"), c1 = el("div", "card"), c2 = el("div", "card");
    c1.appendChild(el("h3", null, "Конверсия по этапам: сколько кандидатов дошло"));
    bars(c1, d.funnel.map(function (f, n) { return [f[0], f[1], n ? "от предыдущего этапа: " + (d.funnel[n - 1][1] ? Math.round(f[1] * 100 / d.funnel[n - 1][1]) : 0) + "%" : "все анкеты"]; }), d.total,
      function (v) { return v + (d.total ? " · " + Math.round(v * 100 / d.total) + "%" : ""); });
    c1.appendChild(el("h3", "mt", "Сейчас на этапах"));
    bars(c1, Object.keys(d.statuses).map(function (s) { return [META.statuses[s] || s, d.statuses[s]]; }), d.total);
    c1.appendChild(el("h3", "mt", "По должностям"));
    bars(c1, Object.keys(d.positions).map(function (p) { return [p, d.positions[p], "средний балл " + d.pos_avg[p] + "%"]; }), d.total);
    if (!d.total) c1.appendChild(el("div", "minor", "Анкет пока нет"));
    c2.appendChild(el("h3", null, "Средняя оценка по компетенциям (1–5), слабые сверху"));
    if (!d.competencies.length) c2.appendChild(el("div", "minor", "Анкет пока нет"));
    bars(c2, d.competencies.map(function (x) { return [x[0], x[1], "анкет: " + x[2]]; }), 5, function (v) { return v.toFixed(1); });
    add(g, c1, c2); main.appendChild(g);
    var c4 = el("div", "card"); c4.style.marginBottom = "14px";
    c4.appendChild(el("h3", null, "Частые риски"));
    if (!d.top_risks.length) c4.appendChild(el("div", "minor", "Флагов пока нет"));
    d.top_risks.forEach(function (r) { var row = el("div", "risk"); add(row, el("span", null, r[0]), el("b", null, String(r[1]))); c4.appendChild(row); });
    main.appendChild(c4);
    main.appendChild(el("div", "sec", "Последние анкеты"));
    main.appendChild(table(d.recent));

}

// ---------- кандидаты
function table(items) {

  add(t, add(el("thead"), th), tb);

    var tr = el("tr"); tr.setAttribute("data-id", c.id);
    var who = el("td"); add(who, el("div", "name", c.fio || "-"), el("div", "minor", [c.age ? c.age + " лет" : "", c.phone].filter(Boolean).join(" · ")));
    var v = el("td"); v.appendChild(tag(c.verdict, c.verdict_ru));
    var s = el("td"); s.appendChild(tag(c.status, c.status_ru));
    add(tr, who, el("td", null, c.pos), el("td", "pct", c.pct + "%"), v, el("td", null, "🔴 " + c.red + "  🟡 " + c.yellow), s, el("td", null, c.branch || "-"), el("td", "minor", fmtDate(c.ts)));
    tr.onclick = function () { openCandidate(c.id); };

}
function select(id, first, map, value) {

  Object.keys(map).forEach(function (k) { s.appendChild(new Option(map[k], k)); });
  s.value = value; return s;
}
function candidates(main) {
  add(main, el("h1", null, "Кандидаты"), el("div", "sub", "Анкеты из Telegram Mini App и чата"));
  var f = el("div", "filters"), q = el("input"), holder = el("div"), count = el("div", "minor");
  q.id = "q"; q.placeholder = "Поиск: имя, телефон, район, филиал"; q.value = filters.q;
  var v = select("fv", "Все рекомендации", META.verdicts, filters.verdict), s = select("fs", "Все статусы", META.statuses, filters.status);
  var p = select("fp", "Все должности", {"Консультант": "Консультант", "Кассир": "Кассир"}, filters.pos);
  var o = select("fo", "Сначала высокий балл", {"new": "Сначала новые"}, filters.sort);
  var csv = el("a", "btn alt", "Скачать CSV"); csv.href = "/api/export.csv"; csv.style.textDecoration = "none";
  add(f, q, v, s, p, o, csv); count.style.margin = "0 0 8px"; add(main, f, count, holder);
  function load() {
    filters = {q: q.value, verdict: v.value, status: s.value, pos: p.value, sort: o.value};
    var qs = Object.keys(filters).filter(function (k) { return filters[k]; }).map(function (k) { return k + "=" + encodeURIComponent(filters[k]); }).join("&");
    api("/api/candidates" + (qs ? "?" + qs : "")).then(function (d) {
      holder.textContent = ""; count.textContent = "Найдено: " + d.count; holder.appendChild(table(d.items));
    }).catch(function (e) { if (e.message !== "auth") { holder.textContent = ""; holder.appendChild(el("div", "err", e.message)); } });
  }
  q.oninput = function () { clearTimeout(timer); timer = setTimeout(load, 250); };
  v.onchange = s.onchange = p.onchange = o.onchange = load;

// ---------- воронка: доска с этапами
var dragId = null;
function kcard(c, reload) {
  var k = el("div", "kc"); k.setAttribute("data-id", c.id); k.draggable = true;
  var ph; if (c.photo) { ph = el("img"); ph.alt = ""; ph.loading = "lazy"; ph.src = "/api/candidates/" + c.id + "/photo"; ph.draggable = false; ph.onerror = function () { ph.replaceWith(el("div", "noimg")); }; } else ph = el("div", "noimg");
  var info = el("div"); add(info, el("div", "name", c.fio || "-"), el("div", "minor", c.phone || ""));
  var r2 = el("div", "row2"), mv = el("button", "mv", "→"); mv.title = "Переместить"; mv.setAttribute("aria-label", "Переместить на другой этап");
  add(r2, el("span", "minor", c.pos), el("b", null, c.pct + "%"), tag(c.verdict, c.verdict_ru));
  if (c.red || c.yellow) r2.appendChild(el("span", "minor", "🔴" + c.red + " 🟡" + c.yellow));
  r2.appendChild(el("span", c.days >= 5 ? "old" : "minor", c.days + " дн."));
  if (c.notice === "failed") r2.appendChild(el("span", "old", "не доставлено"));
  r2.appendChild(mv);
  add(k, ph, info, r2);
  k.addEventListener("dragstart", function (e) { dragId = c.id; k.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(c.id)); });
  k.addEventListener("dragend", function () { dragId = null; k.classList.remove("drag"); });
  mv.onclick = function (e) { e.stopPropagation(); pickStage(c, reload); };
  k.onclick = function () { openCandidate(c.id); };
  return k;
}
function dropTarget(node, stage, find, reload) {
  node.addEventListener("dragover", function (e) { e.preventDefault(); node.classList.add("over"); });
  node.addEventListener("dragleave", function () { node.classList.remove("over"); });
  node.addEventListener("drop", function (e) {
    e.preventDefault(); node.classList.remove("over");
    var c = find(dragId || parseInt(e.dataTransfer.getData("text/plain"), 10)); if (c && c.status !== stage) moveDialog(c, stage, reload);
  });
}
function board(main) {
  add(main, el("h1", null, "Воронка"), el("div", "sub", "Перетащите карточку на следующий этап. Перед отправкой сообщения кандидату вы увидите его текст."));
  var f = el("div", "filters"), q = el("input"), p = select("bp", "Все должности", {"Консультант": "Консультант", "Кассир": "Кассир"}, ""), holder = el("div");
  q.id = "bq"; q.placeholder = "Поиск: имя, телефон, филиал"; add(f, q, p); add(main, f, holder);
  function load() {
    var qs = [q.value ? "q=" + encodeURIComponent(q.value) : "", p.value ? "pos=" + encodeURIComponent(p.value) : ""].filter(Boolean).join("&");
    api("/api/board" + (qs ? "?" + qs : "")).then(function (d) {
      var all = {}; holder.textContent = "";
      var b = el("div", "board");
      d.columns.forEach(function (col) {
        var c = el("div", "col"); c.setAttribute("data-stage", col.key); var h = el("h4"); add(h, document.createTextNode(col.label), el("span", null, String(col.count))); c.appendChild(h);
        col.items.forEach(function (it) { all[it.id] = it; c.appendChild(kcard(it, load)); });
        if (!col.items.length) c.appendChild(el("div", "minor", "Пусто"));
        dropTarget(c, col.key, function (id) { return all[id]; }, load); b.appendChild(c);
      });
      var z = el("div", "zones");
      [["zaxira", "Резерв"], ["rad", "Отказ"]].forEach(function (x) {
        var zone = el("div", "zone", x[1] + " · " + d.off[x[0]] + " — перетащите сюда"); zone.setAttribute("data-stage", x[0]);
        zone.onclick = function () { filters = {q: "", verdict: "", status: x[0], pos: "", sort: ""}; page = "candidates"; shell(); };
        dropTarget(zone, x[0], function (id) { return all[id]; }, load); z.appendChild(zone);
      });
      add(holder, b, z);
    }).catch(function (e) { if (e.message !== "auth") { holder.textContent = ""; holder.appendChild(el("div", "err", e.message)); } });
  }
  q.oninput = function () { clearTimeout(timer); timer = setTimeout(load, 250); }; p.onchange = load;
  load();
}
function closeDlg() { Array.prototype.forEach.call(document.querySelectorAll(".dlg"), function (e) { e.remove(); }); }
function pickStage(c, done) {   // для телефона и клавиатуры: выбор этапа кнопками вместо перетаскивания
  closeDlg(); var w = el("div", "dlg"), box = el("div", "box"); add(box, el("h3", null, c.fio || "-"), el("div", "minor", "Куда переместить?"));
  var acts = el("div", "acts"); acts.style.marginTop = "12px";
  Object.keys(META.statuses).forEach(function (s) { if (s === c.status) return; var b = el("button", null, META.statuses[s]); b.setAttribute("data-to", s); b.onclick = function () { moveDialog(c, s, done); }; acts.appendChild(b); });
  var x = el("button", "btn alt", "Отмена"); x.style.marginTop = "14px"; x.style.width = "100%"; x.onclick = closeDlg;
  add(box, acts, x); w.appendChild(box); w.onclick = function (e) { if (e.target === w) closeDlg(); }; document.body.appendChild(w);
}
function moveDialog(c, stage, done) {   // подтверждение: что уйдёт кандидату
  closeDlg();
  var w = el("div", "dlg"), box = el("div", "box"), fields = {}, inputs = {}, t = null;
  var req = (META.fields[stage] || [[], []])[0], opt = (META.fields[stage] || [[], []])[1];
  add(box, el("h3", null, (c.fio || "-")), el("div", "minor", (META.statuses[c.status] || c.status) + " → " + META.statuses[stage]));
  req.concat(opt).forEach(function (k) {
    var inp = el("input"); inp.type = k === "date" ? "date" : k === "time" ? "time" : "text"; inp.id = "f-" + k; inp.maxLength = 120;
    if (k === "place") { inp.value = c.branch || ""; inp.placeholder = "Например: Чиланзар, ул. Катартал, 1"; }
    if (stage === "sozvon" && k === "time") { inp.type = "text"; inp.placeholder = "Например: сегодня после 15:00"; }
    inputs[k] = inp; inp.oninput = function () { err.textContent = ""; clearTimeout(t); t = setTimeout(preview, 250); };
    add(box, el("label", null, META.field_ru[k] + (req.indexOf(k) < 0 ? " (необязательно)" : "")), inp);
  });
  var reason = null;
  if (stage === "rad") { reason = el("select"); reason.id = "reason"; reason.appendChild(new Option("Не указана", "")); META.reasons.forEach(function (r) { reason.appendChild(new Option(r, r)); });
    add(box, el("label", null, "Причина отказа (для статистики, кандидату не показывается)"), reason); }
  var chk = el("label", "chk"), cb = el("input"); cb.type = "checkbox"; cb.id = "notify"; add(chk, cb, el("span", null, "Отправить сообщение кандидату в Telegram"));
  var msg = el("div", "msg"), note = el("div", "minor"), err = el("div", "err"), btns = el("div", "btns"), ok = el("button", "btn", "Переместить"), no = el("button", "btn alt", "Отмена");
  ok.id = "moveOk"; no.id = "moveNo"; note.style.marginTop = "6px";
  add(btns, no, ok); add(box, chk, msg, note, err, btns); w.appendChild(box); document.body.appendChild(w);
  no.onclick = closeDlg;
  function vals() { Object.keys(inputs).forEach(function (k) { fields[k] = inputs[k].value; }); return fields; }
  var first = true;
  function preview() {
    api("/api/candidates/" + c.id + "/preview", {status: stage, fields: vals()}).then(function (p) {
      if (first) { cb.checked = p.forward && !!p.text; first = false; if (!p.text) { chk.classList.add("hidden"); msg.classList.add("hidden"); } }
      msg.textContent = p.text; var h = parseInt(new Intl.DateTimeFormat("ru-RU", {hour: "numeric", hour12: false, timeZone: "Asia/Tashkent"}).format(new Date()), 10);
      note.textContent = (p.text ? "Язык сообщения: " + ({uz: "узбекский", ru: "русский", en: "английский"}[p.lang] || p.lang) + ". " : "") + (!p.forward ? "Возврат на предыдущий этап: по умолчанию без сообщения. " : "") +
        (cb.checked && (h < 8 || h >= 21) ? "Сейчас в Ташкенте ночь: сообщение придёт кандидату сразу." : "");
      ok.textContent = cb.checked ? "Отправить и переместить" : "Переместить без сообщения";
      msg.style.opacity = cb.checked ? "1" : ".45";
    }).catch(function (e) { err.textContent = e.message; });
  }
  cb.onchange = preview; preview();
  ok.onclick = function () {
    err.textContent = ""; ok.disabled = true;
    api("/api/candidates/" + c.id + "/move", {status: stage, notify: cb.checked, fields: vals(), reason: reason ? reason.value : ""}).then(function (r) {
      closeDlg(); toast(r.delivered === true ? "Перемещено, сообщение доставлено" : r.delivered === false ? "Перемещено, но сообщение НЕ доставлено" : "Перемещено без сообщения"); if (done) done();
    }).catch(function (e) { err.textContent = e.message; ok.disabled = false; });
  };
}

// ---------- карточка кандидата
function closeDrawer() { Array.prototype.forEach.call(document.querySelectorAll(".drawer,.shade"), function (e) { e.remove(); }); }
function openCandidate(id) {
  api("/api/candidates/" + id).then(function (c) {
    closeDrawer();
    var shade = el("div", "shade"), d = el("div", "drawer"), x = el("button", "x", "×");
    shade.onclick = x.onclick = function () { closeDrawer(); shell(); };
    d.appendChild(x);
    var who = el("div", "who"), info = el("div");
    if (c.photo) { var im = el("img"); im.alt = "Селфи"; im.src = "/api/candidates/" + id + "/photo"; im.onerror = function () { im.replaceWith(el("div", "noimg")); }; who.appendChild(im); }
    else who.appendChild(el("div", "noimg"));
    add(info, el("h2", null, c.fio || "-"), el("div", "minor", [c.pos, c.age ? c.age + " лет" : "", c.phone, c.username ? "@" + c.username : ""].filter(Boolean).join(" · ")));
    var line = el("div"); line.style.marginTop = "8px"; add(line, el("span", "pct", c.pct + "%  "), tag(c.verdict, c.verdict_ru)); info.appendChild(line);
    add(who, info); d.appendChild(who);
    if (c.slot) d.appendChild(el("div", "minor", "Удобное время для собеседования: " + c.slot));
    var pdf = el("a", "btn", "Скачать анкету в PDF"); pdf.id = "pdfBtn"; pdf.href = "/api/candidates/" + id + "/pdf"; pdf.setAttribute("download", "");
    pdf.style.cssText = "display:inline-block;text-decoration:none;margin-top:12px;color:inherit"; d.appendChild(pdf);

    d.appendChild(el("div", "sec", "Этап"));
    if (c.notice === "failed") d.appendChild(el("div", "warnbox", "Последнее сообщение кандидату не доставлено (возможно, он заблокировал бота). Свяжитесь по телефону."));
    if (c.reason) d.appendChild(el("div", "minor", "Причина отказа: " + c.reason));
    var acts = el("div", "acts");
    Object.keys(META.statuses).forEach(function (s) {
      var b = el("button", c.status === s ? "on" : "", META.statuses[s]); b.setAttribute("data-status", s);
      b.onclick = function () { if (c.status !== s) moveDialog(c, s, function () { openCandidate(id); }); };
      acts.appendChild(b);
    });
    d.appendChild(acts);

    d.appendChild(el("div", "sec", "Филиал"));
    var rf = el("div", "rowf"), bi = el("input", "field"), bs = el("button", "btn alt", "Сохранить");
    bi.id = "branch"; bi.maxLength = 80; bi.placeholder = "Например: Чиланзар"; bi.value = c.branch;
    bs.onclick = function () { api("/api/candidates/" + id, {branch: bi.value}).then(function () { toast("Филиал сохранён"); }).catch(function (e) { toast(e.message); }); };
    add(rf, bi, bs); d.appendChild(rf);

    d.appendChild(el("div", "sec", "Риски и флаги"));
    var fl = el("div", "flags");
    if (!c.flags.length) fl.appendChild(el("div", null, "По анкете серьёзных рисков не выявлено"));
    c.flags.forEach(function (f) { fl.appendChild(el("div", null, f[0] + " " + f[1])); });
    d.appendChild(fl);

    d.appendChild(el("div", "sec", "Полный профиль"));
    d.appendChild(el("pre", null, c.profile));
    if (c.history.length) {
      d.appendChild(el("div", "sec", "История статусов"));
      c.history.forEach(function (h) {
        d.appendChild(el("div", "minor", fmtDate(h.ts) + ": " + (META.statuses[h.old_status] || h.old_status) + " → " + (META.statuses[h.new_status] || h.new_status) + " (" + h.changed_by + ")" + (h.notified === 1 ? ", сообщение доставлено" : h.notified === 0 ? ", сообщение НЕ доставлено" : ", без сообщения") + (h.note ? " · " + h.note : "")));
      });
    }
    add(document.body, shade, d);
  }).catch(function (e) { if (e.message !== "auth") toast(e.message); });
}

function start() { return api("/api/me").then(function (m) { META = m; shell(); }); }
start().catch(function (e) { if (e.message !== "auth") showLogin(e.message); });
})();
