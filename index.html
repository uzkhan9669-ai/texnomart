<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc800">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Texnomart - Sotuvchi-maslahatchi anketasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --brand-yellow: #ffc800;
  --brand-yellow-hover: #e6b400;
  --dark-ink: #1c1c1e;
  --paper: #ffffff;
  --surface: #f7f7f9;
  --surface-border: #e2e2e8;
  --text-primary: #1c1c1e;
  --text-secondary: #55555c;
  --danger: #e53935;
  --font-body: 'Montserrat', system-ui, -apple-system, sans-serif;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: var(--paper);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 12px;
}

.logo {
  font-weight: 800;
  font-size: 21px;
  color: var(--dark-ink);
  background: var(--brand-yellow);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  user-select: none;
}
.logo span.asterisk { color: var(--dark-ink); margin-left: 1px; font-size: 22px; }

.step-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--surface);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--surface-border);
}

.bar {
  height: 5px;
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--brand-yellow);
  border-radius: 10px;
  transition: width 0.35s ease;
}

main { flex: 1; display: flex; flex-direction: column; }

section.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeInRight 0.3s ease forwards;
}

@keyframes fadeInRight {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

h1, h2 {
  font-weight: 800;
  margin: 0;
  color: var(--dark-ink);
}
h1 { font-size: 22px; }
h2 { font-size: 19px; }

p { margin: 0; }
.lead { color: var(--text-secondary); font-size: 14px; font-weight: 500; }

.hero {
  background: var(--brand-yellow);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
}
.hero h1 { color: var(--dark-ink); }
.hero p { margin-top: 6px; font-weight: 600; font-size: 14px; color: rgba(28, 28, 30, 0.85); }

.block-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.05em;
  margin-bottom: -4px;
}

input[type=text], input[type=tel], input[type=number], textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  padding: 14px 16px;
  border: 2px solid var(--surface-border);
  border-radius: var(--radius-md);
  background: var(--paper);
  color: var(--dark-ink);
}
textarea { resize: vertical; min-height: 90px; }
input:focus, textarea:focus { outline: none; border-color: var(--dark-ink); box-shadow: 0 0 0 3px rgba(255, 200, 0, 0.3); }

.field { display: flex; flex-direction: column; gap: 4px; }
.err { color: var(--danger); font-size: 12.5px; font-weight: 600; min-height: 18px; }

.chips { display: grid; gap: 8px; }
.chip {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--surface-border);
  background: var(--paper);
  color: var(--text-primary);
  cursor: pointer;
}
.chip[aria-pressed=true] { border-color: var(--dark-ink); background: var(--brand-yellow); color: var(--dark-ink); }

.file-box {
  border: 2px dashed var(--surface-border);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
  background: var(--surface);
  cursor: pointer;
}
.file-preview {
  max-width: 140px;
  max-height: 140px;
  border-radius: var(--radius-md);
  margin: 10px auto 0;
  display: block;
  border: 3px solid var(--brand-yellow);
  object-fit: cover;
}

.btn {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 15px;
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--dark-ink);
  color: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.yellow { background: var(--brand-yellow); color: var(--dark-ink); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }

.actions { margin-top: auto; padding-top: 12px; display: grid; gap: 10px; }

.done { text-align: center; align-items: center; justify-content: center; gap: 16px; margin: auto 0; }
.badge {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--brand-yellow);
  display: grid; place-items: center;
  margin: 0 auto;
}
.badge svg { width: 40px; height: 40px; }

.summary {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  width: 100%;
  text-align: left;
  display: grid; gap: 6px;
  font-size: 14px;
}
.summary b { font-weight: 800; color: var(--dark-ink); }
.summary span { color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">texnomart<span class="asterisk">*</span></div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <main id="main"></main>
</div>

<script>
/* ==================== CONFIG & QUESTIONS ==================== */
var CONFIG = {
  endpoint: "https://script.google.com/macros/s/AKfycbwWVllw2ORcJd-F0RwsM1Haq-S1Njhgn2GMFlO3iE-4nS8nBIq9K5_ZzO_UuA1u5M6VyA/exec",
  secret: "texnomart2026",
  job: "Sotuvchi-konsultant",
  company: "Texnomart"
};

var QUESTIONS = [
  // Блок 1
  { key: "fio", block: "1/5 · Tanishuv va ish shartlari", type: "text", text: "Ismingiz va familiyangiz? (F.I.Sh.)", placeholder: "Jasur Rahimov" },
  { key: "age", type: "number", text: "Yoshingiz nechada?", placeholder: "22" },
  { key: "marital_status", type: "choice", text: "Oilaviy ahvolingiz?", options: ["Uylangan / Turmushga chiqqan", "Bo'ydoq / Turmush qurmagan"] },
  { key: "photo", type: "photo", text: "Rasmga tushib (Selfi) yuklang" },
  { key: "phone", type: "tel", text: "Bog'lanish uchun telefon raqamingiz", placeholder: "+998 90 123 45 67" },
  { key: "district", type: "text", text: "Qaysi tuman yoki shaharda yashaysiz? Mo'ljalni ham yozing.", placeholder: "Toshkent sh., Chilonzor" },
  { key: "commute", type: "choice", text: "Do'konga yetib borish uchun qancha vaqt ketadi?", options: ["30 daqiqagacha", "30-60 daqiqa", "60 daqiqadan ko'p"] },
  { key: "lang", type: "choice", text: "O'zbek va rus tillarini qanday bilasiz?", options: ["Ikkala tilni erkin bilaman", "Bittasini erkin, ikkinchisini suhbat darajasida", "Faqat bitta tilni erkin bilaman"] },
  { key: "schedule", type: "choice", text: "Ish tartibi: haftada 6 kun ish, 1 kun dam. Smenalar suzuvchi: 1-smena 09:00-18:00, 2-smena 13:00-22:00. Dam olish va bayram kunlari ham grafik bo'yicha ishlanadi. Sizga mos keladimi?", options: ["Ha, mos keladi", "Mos, lekin barcha dam olish kunlari emas", "Boshqa grafik kerak (2/2, 5/2, yarim kun)"] },
  { key: "evening", type: "choice", text: "2-smena soat 22:00 gacha davom etadi. Kechqurun uyga qaytish sizga muammo bo'lmaydimi?", options: ["Muammo emas", "Qiyin, lekin hal qilsam bo'ladi", "Kechki smenada ishlay olmayman"] },
  { key: "training", type: "choice", text: "Ishni boshlashdan oldin 14 kunlik o'qish bor (kompaniya hisobidan, ustoz bilan). Unda to'liq qatnasha olasizmi?", options: ["Ha, to'liq qatnashaman", "Ba'zi kunlari kela olmayman", "Yo'q, o'qishga vaqtim yo'q"] },
  { key: "start", type: "choice", text: "Qachon ishga chiqa olasiz?", options: ["Darhol", "1-2 hafta ichida", "2 haftadan keyin"] },
  { key: "income", type: "choice", text: "Oylik daromad bo'yicha kutganingiz qancha?", options: ["3 mln so'mgacha", "3-5 mln so'm", "5-8 mln so'm", "8 mln so'mdan yuqori"] },
  { key: "kpi", type: "choice", text: "Daromadning bir qismi KPI (sotuv rejasi) bo'yicha bonusga bog'liq. Bu sizga qanday?", options: ["Yoqadi, ko'proq sotsam, ko'proq topaman", "Maqbul, lekin qat'iy oylik ham muhim", "Faqat qat'iy oylik istayman"] },
  { key: "workload", type: "choice", text: "Ish hajmi katta: mijozlarga xizmat, tovarni joylashtirish, kassa, inventarizatsiya, tozalik. Shunday hajm sizga to'g'ri keladimi?", options: ["Ha, ko'p ishlashga tayyorman", "Tayyorman, lekin sharoit va yordam muhim", "Menga qiyin bo'ladi"] },
  { key: "change", type: "choice", text: "Do'konda o'zgarishlar tez-tez bo'ladi: yangi aksiyalar, tovarlar, jarayonlar, smenalar. Siz bunga qanday qaraysiz?", options: ["Tez moslashaman, yangilikni yoqtiraman", "Moslashaman, lekin vaqt kerak", "O'zgarishlar menga yoqmaydi"] },

  // Блок 2
  { key: "exp", block: "2/5 · Tajriba va ketish sabablari", type: "choice", text: "Savdo sohasidagi tajribangiz?", options: ["Tajriba yo'q", "1 yilgacha", "1-3 yil", "3 yildan ortiq"] },
  { key: "tech_exp", type: "choice", text: "Maishiy texnika yoki elektronika sotish tajribangiz bo'lganmi?", options: ["Ha", "Yo'q"] },
  { key: "jobs_year", type: "choice", text: "So'nggi 1 yilda nechta ish joyida ishlagansiz?", options: ["0-1", "2", "3 va undan ko'p"] },
  { key: "last_job", type: "text", text: "So'nggi ish joyingiz haqida yozing: kompaniya, lavozim, qancha ishlagansiz, nima bilan shug'ullangansiz.", placeholder: "Masalan: Texnomart, sotuvchi, 1 yil..." },
  { key: "reason", type: "choice", text: "So'nggi ish joyidan ketishingizning asosiy sababi?", options: ["O'sish, boshqa ish formati", "Ko'chish, o'qish, oila", "Grafik mos kelmadi", "Kam to'lashdi, kechiktirishdi", "Rahbar yoki jamoa bilan nizo", "Jarimalar, bosim", "Qisqartirishdi, do'kon yopildi", "Bu birinchi ish joyim", "Boshqa"] },
  { key: "reason_text", type: "text", text: "Bir-ikki gap bilan yozing: aynan nima bo'lgan?", placeholder: "Izoh yozing..." },
  { key: "reference", type: "choice", text: "Sobiq rahbaringizga tavsiya uchun qo'ng'iroq qilsak bo'ladimi?", options: ["Ha, kontakt beraman", "Yo'q", "Tegishli emas, tajriba yo'q"] },

  // Блок 3
  { key: "calc_change", block: "3/5 · Hisob va sotuv ko'nikmalari", type: "number", text: "1-masala. Xarid 3 740 000 so'm, mijoz 5 000 000 so'm berdi. Qaytim qancha?", placeholder: "1260000" },
  { key: "calc_discount", type: "number", text: "2-masala. Televizor 4 800 000 so'm, chegirma 10%. Mijoz qancha to'laydi?", placeholder: "4320000" },
  { key: "needs", type: "text", text: "Mijoz muzlatgich tanlayapti. Unga qanday savollar berasiz? (3 ta savol)", placeholder: "Savollaringizni yozing..." },
  { key: "objection", type: "text", text: "Mijoz: «Qimmat ekan, o'ylab ko'raman» dedi. Siz nima deb javob berasiz?", placeholder: "Javobingizni yozing..." },

  // Блок 4
  { key: "conflict", block: "4/5 · Vaziyatli savollar", type: "text", text: "Mijoz sotib olgan texnikasi bilan qaytib keldi: «U nosoz, siz meni aldadingiz!» Nima qilasiz?", placeholder: "Harakatlaringizni yozing..." },
  { key: "sjt_customer", type: "choice", text: "Mijoz arzon telefon so'rayapti. Sizda bonusi yuqori qimmatroq model ham bor. Nima qilasiz?", options: ["Eng qimmat modelni tavsiya qilaman", "Mijoz byudjetiga mos modelni ko'rsataman", "Ikkala variantni ko'rsataman", "Faqat so'raganini beraman"] },
  { key: "sjt_team", type: "choice", text: "Kassada navbat uzaydi, hamkasbingiz yolg'iz, sizda mijoz yo'q. Nima qilasiz?", options: ["Mening ishim emas", "Darhol yordamga boraman", "So'rashsa yordam beraman", "Rahbarga xabar beraman"] },
  { key: "sjt_learn", type: "choice", text: "Yangi model keldi, xususiyatlarini bilmaysiz, mijoz so'rayapti. Nima qilasiz?", options: ["Taxminan javob beraman", "Ko'rsatmadan o'rganaman, o'qib chiqaman", "Hamkasbdan so'rayman", "Boshqa xodimga yo'naltiraman"] },
  { key: "sjt_stress", type: "choice", text: "Soat 19:00, mijozlar ko'p, kassa buzildi, rahbar yo'q. Nima qilasiz?", options: ["Rahbar kelishini kutaman", "Mijozlarni ogohlantiraman, texnik xodimni chaqiraman", "Xotirjam kutaman", "Mijozga e'tiroz bildiraman"] },
  { key: "late", type: "choice", text: "Smenaga kechikayotganingizni tushundingiz. Nima qilasiz?", options: ["Oldindan rahbarga xabar beraman va tez yetib boraman", "Qachon yetsam, o'shanda kelaman", "Joyida tushuntiraman", "Muammo emas"] },

  // Блок 5
  { key: "motive", block: "5/5 · Motivatsiya", type: "choice", text: "Ishda siz uchun eng muhimi nima?", options: ["Daromad va sotuvdan foiz", "O'qish va karyera o'sishi", "Barqarorlik va rasmiy ish haqi", "Qulay grafik", "Vaqtinchalik ish"] }
];

var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var state = { index: 0, answers: {} };
var main = document.getElementById("main");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

function updateProgress() {
  var total = QUESTIONS.length;
  var current = state.index + 1;
  var pct = Math.round((state.index / total) * 100);
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = current + " / " + total;
}

function renderQuestion() {
  main.innerHTML = "";
  if (state.index >= QUESTIONS.length) {
    renderDoneScreen();
    return;
  }

  updateProgress();
  var q = QUESTIONS[state.index];
  var s = document.createElement("section");
  s.className = "screen";

  var html = "";
  if (q.block) {
    html += '<div class="block-title">' + esc(q.block) + '</div>';
  }
  html += '<h2>' + esc(q.text) + '</h2>';

  if (q.type === "choice") {
    html += '<div class="chips" id="opts"></div>';
    html += '<div class="err" id="err"></div>';
    html += '<div class="actions"><button class="btn yellow" id="next" disabled>Keyingisi</button></div>';
  } else if (q.type === "photo") {
    var hasPhoto = !!state.answers[q.key];
    html += '<div class="file-box" onclick="document.getElementById(\'photoInput\').click()">';
    html += '📷 <b>Selfi olish uchun bosing</b><br><span style="font-size:12px;color:var(--text-secondary)">Kameradan rasmga tushing</span>';
    html += '<input type="file" id="photoInput" accept="image/*" capture="user" style="display:none">';
    html += '<img id="previewImg" class="file-preview" src="' + (state.answers[q.key] || '') + '" style="display:' + (hasPhoto ? 'block' : 'none') + '">';
    html += '</div>';
    html += '<div class="err" id="err"></div>';
    html += '<div class="actions"><button class="btn yellow" id="next" ' + (hasPhoto ? '' : 'disabled') + '>Keyingisi</button></div>';
  } else {
    var inputType = q.type === "number" ? "number" : (q.type === "tel" ? "tel" : "text");
    var val = state.answers[q.key] || "";
    if (q.type === "text" && q.key !== "fio" && q.key !== "district" && q.key !== "phone") {
      html += '<div class="field"><textarea id="f-val" placeholder="' + esc(q.placeholder || "") + '">' + esc(val) + '</textarea><div class="err" id="err"></div></div>';
    } else {
      html += '<div class="field"><input id="f-val" type="' + inputType + '" placeholder="' + esc(q.placeholder || "") + '" value="' + esc(val) + '"><div class="err" id="err"></div></div>';
    }
    html += '<div class="actions"><button class="btn yellow" id="next">Keyingisi</button></div>';
  }

  s.innerHTML = html;
  main.appendChild(s);

  if (q.type === "choice") {
    var optsBox = s.querySelector("#opts");
    var nextBtn = s.querySelector("#next");
    var selectedOpt = state.answers[q.key];

    q.options.forEach(function (optText, idx) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = optText;
      var isPressed = (selectedOpt === optText);
      btn.setAttribute("aria-pressed", String(isPressed));
      if (isPressed) nextBtn.disabled = false;

      btn.onclick = function () {
        optsBox.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        btn.setAttribute("aria-pressed", "true");
        state.answers[q.key] = optText;
        state.answers[q.key + "_i"] = idx;
        nextBtn.disabled = false;
        s.querySelector("#err").textContent = "";
      };
      optsBox.appendChild(btn);
    });

    nextBtn.onclick = function () {
      if (!state.answers[q.key]) {
        s.querySelector("#err").textContent = "Iltimos, javobni tanlang.";
        return;
      }
      state.index++;
      renderQuestion();
    };
  } else if (q.type === "photo") {
    var photoInput = s.querySelector("#photoInput");
    var previewImg = s.querySelector("#previewImg");
    var nextBtn = s.querySelector("#next");

    photoInput.onchange = function (e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          state.answers[q.key] = ev.target.result;
          previewImg.src = ev.target.result;
          previewImg.style.display = "block";
          nextBtn.disabled = false;
          s.querySelector("#err").textContent = "";
        };
        reader.readAsDataURL(file);
      }
    };

    nextBtn.onclick = function () {
      if (!state.answers[q.key]) {
        s.querySelector("#err").textContent = "Iltimos, rasmga tushing.";
        return;
      }
      state.index++;
      renderQuestion();
    };
  } else {
    var nextBtn = s.querySelector("#next");
    var inputEl = s.querySelector("#f-val");
    if (inputEl) inputEl.focus();

    nextBtn.onclick = function () {
      var val = inputEl.value.trim();
      var errEl = s.querySelector("#err");
      errEl.textContent = "";

      if (!val && q.key !== "last_job") {
        errEl.textContent = "Iltimos, maydonni to'ldiring.";
        return;
      }
      if (q.key === "phone" && val.replace(/\D/g, "").length < 9) {
        errEl.textContent = "Telefon raqami noto'g'ri.";
        return;
      }

      state.answers[q.key] = val;
      state.index++;
      renderQuestion();
    };
  }
  window.scrollTo(0, 0);
}

function renderWelcome() {
  document.getElementById("barFill").style.width = "0%";
  document.getElementById("stepLabel").textContent = "Kirish";
  var s = document.createElement("section");
  s.className = "screen";
  s.innerHTML = 
    '<div class="hero"><h1>Texnomart jamoasiga xush kelibsiz!</h1><p>Sotuvchi-maslahatchi lavozimi uchun anketa.</p></div>' +
    '<p class="lead">Ushbu anketa orqali siz o\'z ko\'nikmalaringizni namoyish etasiz. Savollarga diqqat bilan javob bering.</p>' +
    '<div class="actions"><button class="btn yellow" id="startBtn">Anketani boshlash</button></div>';
  main.innerHTML = "";
  main.appendChild(s);
  s.querySelector("#startBtn").onclick = function () {
    state.index = 0;
    renderQuestion();
  };
}

function payload() {
  if (!state.id) state.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return {
    secret: CONFIG.secret,
    id: state.id,
    job: CONFIG.job,
    name: state.answers["fio"] || "",
    fio: state.answers["fio"] || "",
    age: state.answers["age"] || "",
    marital_status: state.answers["marital_status"] || "",
    photo: state.answers["photo"] || "",
    city: state.answers["district"] || "",
    phone: state.answers["phone"] || "",
    answers: state.answers
  };
}

function submitData() {
  var data = payload();

  // 1. Отправляем в Telegram Bot через WebApp API (если поддерживается)
  if (tg && typeof tg.sendData === "function") {
    try {
      tg.sendData(JSON.stringify(data));
    } catch (e) {
      console.error("tg.sendData error:", e);
    }
  }

  // 2. Надежная отправка в Google Таблицу через скрытую форму (обход CORS)
  if (CONFIG.endpoint) {
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = CONFIG.endpoint;
    form.target = 'hidden_iframe';
    form.style.display = 'none';

    var iframe = document.getElementById('hidden_iframe');
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.name = 'hidden_iframe';
      iframe.id = 'hidden_iframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }

    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'data';
    input.value = JSON.stringify(data);
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
  }
}

  document.getElementById("barFill").style.width = "100%";
  document.getElementById("stepLabel").textContent = "";
  
  var firstName = (state.answers["fio"] || "Nomzod").split(" ")[0];
  var s = document.createElement("section");
  s.className = "screen";
  s.innerHTML = 
    '<div class="done">' +
    '<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
    '<h2>Rahmat, ' + esc(firstName) + '!</h2>' +
    '<p class="lead">Anketangiz muvaffaqiyatli qabul qilindi. Tez orada HR-mutaxassisimiz siz bilan bog\'lanadi.</p>' +
    '<div class="summary">' +
      '<span>Lavozim</span><b>Sotuvchi-maslahatchi</b>' +
      '<span style="margin-top:6px">F.I.Sh.</span><b>' + esc(state.answers["fio"] || "—") + '</b>' +
      '<span style="margin-top:6px">Telefon</span><b>' + esc(state.answers["phone"] || "—") + '</b>' +
      '<span style="margin-top:6px">Oilaviy ahvoli</span><b>' + esc(state.answers["marital_status"] || "—") + '</b>' +
    '</div>' +
    '</div>';
  main.innerHTML = "";
  main.appendChild(s);

  submitData();
}
