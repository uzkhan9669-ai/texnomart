<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc800">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Texnomart Ish - Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==================== СТИЛИ И ПЕРЕМЕННЫЕ TEXNOMART ==================== */
:root {
  --brand-yellow: #ffc800;
  --brand-yellow-hover: #e6b400;
  --dark-ink: #1c1c1e;
  --dark-soft: #2c2c2e;
  --paper: #ffffff;
  --surface: #f7f7f9;
  --surface-border: #e2e2e8;
  --text-primary: #1c1c1e;
  --text-secondary: #55555c;
  --text-muted: #8e8e93;
  --danger: #e53935;
  --font-body: 'Montserrat', system-ui, -apple-system, sans-serif;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: var(--paper);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ==================== ШАПКА ==================== */
header.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 12px;
}

/* Точный фирменный логотип Texnomart со звездочкой */
.logo {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -0.04em;
  color: var(--dark-ink);
  background: var(--brand-yellow);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  user-select: none;
}
.logo span.asterisk {
  color: var(--dark-ink);
  margin-left: 1px;
  font-size: 22px;
  line-height: 1;
}

.step-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--surface);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--surface-border);
}

.bar {
  height: 5px;
  background: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--brand-yellow);
  border-radius: 10px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ==================== ОСНОВНОЙ КОНТЕНТ ==================== */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

section.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeInRight {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

h1 {
  font-weight: 800;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--dark-ink);
}

h2 {
  font-weight: 800;
  font-size: 19px;
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--dark-ink);
}

p { margin: 0; }
.lead { color: var(--text-secondary); font-size: 14px; font-weight: 500; }

/* Hero баннер */
.hero {
  background: var(--brand-yellow);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  position: relative;
  overflow: hidden;
}

.hero h1 { margin-top: 0; color: var(--dark-ink); }
.hero p { margin-top: 6px; font-weight: 600; font-size: 14px; color: rgba(28, 28, 30, 0.85); }

/* Плеер видео */
.video-box {
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #000;
  aspect-ratio: 16 / 9;
  width: 100%;
  position: relative;
  box-shadow: var(--shadow-sm);
}

.video-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 12px 6px;
  text-align: center;
}
.stat b {
  display: block;
  font-size: 18px;
  font-weight: 800;
  color: var(--dark-ink);
}
.stat span {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 600;
  margin-top: 2px;
}

.points { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.points li {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  padding: 12px 14px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 13.5px;
}
.points li::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand-yellow);
  box-shadow: 0 0 0 3px var(--dark-ink);
  flex-shrink: 0;
}

label {
  font-weight: 700;
  font-size: 12.5px;
  display: block;
  margin-bottom: 6px;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

input[type=text], input[type=tel], input[type=number], select {
  width: 100%;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  padding: 14px 16px;
  border: 2px solid var(--surface-border);
  border-radius: var(--radius-md);
  background: var(--paper);
  color: var(--dark-ink);
  transition: all 0.2s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--dark-ink);
  box-shadow: 0 0 0 3px rgba(255, 200, 0, 0.3);
}

.field { display: block; }
.err { color: var(--danger); font-size: 12.5px; font-weight: 600; min-height: 18px; margin-top: 4px; }

/* Список вакансий и опций */
.chips { display: grid; gap: 8px; }
.chip, .opt, .slot {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--surface-border);
  background: var(--paper);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s ease;
}

.chip:active, .opt:active, .slot:active {
  transform: scale(0.98);
}

.chip[aria-pressed=true], .slot[aria-pressed=true], .opt.picked {
  border-color: var(--dark-ink);
  background: var(--brand-yellow);
  color: var(--dark-ink);
}

.btn {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 15px;
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--dark-ink);
  color: var(--paper);
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:active { transform: scale(0.98); }
.btn.yellow { background: var(--brand-yellow); color: var(--dark-ink); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }

.actions { margin-top: auto; padding-top: 12px; display: grid; gap: 10px; }
.note { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.4; }

.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .t {
  font-weight: 800;
  font-size: 16px;
  background: var(--dark-ink);
  color: var(--paper);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
}
.timer .t.low { background: var(--danger); }

.qtext { font-size: 16.5px; font-weight: 700; line-height: 1.35; color: var(--dark-ink); }
.opts { display: grid; gap: 8px; }

.done { text-align: center; align-items: center; justify-content: center; gap: 16px; margin: auto 0; }
.badge {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--brand-yellow);
  display: grid;
  place-items: center;
  margin: 0 auto;
}
.badge svg { width: 40px; height: 40px; }

.summary {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  width: 100%;
  text-align: left;
  display: grid;
  gap: 6px;
  font-size: 14px;
}
.summary b { font-weight: 800; color: var(--dark-ink); }
.summary span { color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; }

/* ==================== МИССИЯ И ЦЕННОСТИ ==================== */
.mission-box {
  background: rgba(255, 200, 0, 0.15);
  border-left: 4px solid var(--brand-yellow);
  padding: 12px 14px;
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
}
.mission-title {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.mission-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--dark-ink);
  line-height: 1.35;
}

.values-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.value-card {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.value-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--brand-yellow);
  color: var(--dark-ink);
  display: grid;
  place-items: center;
  font-size: 14px;
  flex-shrink: 0;
  font-weight: 800;
}
.value-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--dark-ink);
  line-height: 1.25;
}

@media (prefers-reduced-motion: reduce) {
  section.screen { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">texnomart<span class="asterisk">*</span></div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <main id="main"></main>
</div>

<script>
/* ==================== CONFIG ==================== */
var CONFIG = {
  testMinutes: 5,
  endpoint: "https://script.google.com/macros/s/AKfycbxi_IqP7-ENv2zxPtdjLJpumJEcDOSMWhbGgefKAmrrZGNjlZaDoKUiNufYy5gJJaa3Mw/exec",
  company: { year: "2008", stores: "40+", staff: "1000+" },
  videoUrl: "IMG_2823.MP4",
  jobs: [
    "Sotuvchi-maslahatchi",
    "Kassir",
    "Haydovchi-ekspeditor",
    "Yukchi (Грузчик)",
    "Farrosh (Уборщица)"
  ],
  timeSlots: ["10:00 - 12:00", "14:00 - 17:00"]
};

/* ==================== TEST SAVOLLARI ==================== */
// Sotuvchi-maslahatchilar uchun savollar
var QUESTIONS_SELLER = [
  ["Tasavvur qiling, savdo zaliga mijoz kirdi. Harakatlaringiz?", ["Unga e'tibor bermaganday ko'rsataman", "Salomlashaman va yordam taklif qilaman", "Uning o'zi murojaat qilishini kutaman"], 1],
  ["Olma belgisi bor brend qanday nomlanadi?", ["Xiaomi", "Samsung", "Apple", "HONOR"], 2],
  ["Bir metrda necha santimetr bor?", ["10 sm", "100 sm", "1000 sm"], 1],
  ["Mijoz mahsulot haqida so'radi, lekin siz uning xususiyatlarini bilmaysiz. Nima qilasiz?", ["O'ylab topaman", "«Bilmayman» deyman", "«Biroz kutib turing, ma'lumotni aniqlab beraman» deyman"], 2],
  ["Ortiqcha so'zni toping:", ["Noutbuk", "Mikroto'lqinli pech", "Muzlatgich", "Kir yuvish mashinasi"], 0],
  ["To'g'ri ketma-ketlikni toping:\n3 – 6 – 12 – 24 – ?", ["28", "30", "48", "36"], 2],
  ["1 900 000 so'mdan 10% chegirma qilganda qancha qoladi?", ["320 000 so'm", "1 710 000 so'm", "2 090 000 so'm", "3 200 000 so'm"], 1],
  ["Qaysi biri mahsulot tavsifiga mos kelmaydi?\nTavsif: Televizor 55 dyuym, kafolat 2 yil, rangi qora, Smart-TV bor, HDMI — 3 ta port", ["Kafolat 2 yil", "HDMI — 2 ta port", "Rangi qora", "Smart-TV bor"], 1],
  ["Qaysi so'z ortiqcha:", ["Mashina", "Velosiped", "Samokat", "Karavot"], 3],
  ["Mijoz: «Sizlarda qimmat!» deydi. Qanday javob berasiz?", ["«Unda boshqa do'konga boring»", "«Biz eng yaxshi narx va sifat munosabatini taklif qilamiz»", "«Ha, qimmat»"], 1]
];

// Kassirlar uchun savollar
var QUESTIONS_CASHIER = [
  ["Xaridor 125 000 so'mlik xarid uchun 200 000 so'm berdi. Qancha qaytim berishingiz kerak?", ["65 000 so'm", "75 000 so'm", "85 000 so'm"], 1],
  ["Naqd pul bilan ishlashda eng muhim qoida qaysi?", ["Pultdan tez foydalanish", "Sanalayotgan pulni har doim diqqat bilan tekshirish va qaytimni aniq berish", "Mijoz bilan uzoq suhbatlashish"], 1],
  ["Mijoz to'lov qilayotganda kupyuraning soxtaligidan shubhalandingiz. Nima qilasiz?", ["Kupyurani yirtib tashlayman", "O'zimni bilmagandek ko'rsatib qabul qilaman", "Xushmuomalalik bilan boshqa kupyura yoki karta orqali to'lovni so'rayman hamda ma'murga xabar beraman"], 2],
  ["Terminallar orqali to'lovni amalga oshirishda qaysi chek mijozga beriladi?", ["Terminalning birinchi (mijoz) cheki", "Z-hisobot", "Ikkala chek ham kassa tortmasida qoladi"], 0],
  ["Ish kuni oxirida kassa balansida kamchilik (сдача) chiqsa nima qilinadi?", ["Darhol ma'murga/bosh kassirga xabar beriladi va kassa hujjati bo'yicha tekshiriladi", "Yashirib qo'yiladi", "Kassa yopilmasdan tashlab ketiladi"], 0]
];

/* ==================== HOLAT ==================== */
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var STEPS = ["welcome", "about", "form", "test-intro", "test", "slot", "done"];
var state = { step: 0, job: "", name: "", age: "", city: "", phone: "", exp: "", expPlace: "", q: 0, score: 0, deadline: 0, slot: "", timerId: null };
var activeQuestions = [];
var main = document.getElementById("main");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function val(v) { return v ? esc(v) : "—"; }

function go(name) {
  state.step = STEPS.indexOf(name);
  var screens = { welcome: renderWelcome, about: renderAbout, form: renderForm, "test-intro": renderTestIntro, test: renderTest, slot: renderSlot, done: renderDone };
  main.innerHTML = "";
  screens[name]();
  var pct = Math.round(state.step / (STEPS.length - 1) * 100);
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = name === "done" ? "" : (state.step + 1) + " / " + STEPS.length;
  window.scrollTo(0, 0);
}
function screen(html) { var s = document.createElement("section"); s.className = "screen"; s.innerHTML = html; main.appendChild(s); return s; }

/* ==================== EKRANLAR ==================== */
function renderWelcome() {
  var videoHtml = CONFIG.videoUrl
    ? '<div class="video-box">' +
        '<video src="' + esc(CONFIG.videoUrl) + '" controls playsinline preload="auto" muted webkit-playsinline></video>' +
      '</div>'
    : '';

  var s = screen(
    '<div class="hero"><h1>Texnomart jamoasiga xush kelibsiz!</h1><p>Bo\'sh ish o\'rinlari uchun qisqa anketa va test.</p></div>' +
    videoHtml +
    '<p class="lead">Kompaniyamiz bilan tanishing, anketani to\'ldiring va suhbat uchun qulay vaqtni tanlang.</p>' +
    '<div class="actions"><button class="btn yellow" id="next">Boshlash</button></div>');
  s.querySelector("#next").onclick = function () { go("about"); };
}

function renderAbout() {
  var c = CONFIG.company;
  var s = screen(
    '<h2>Texnomart haqida</h2>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + val(c.year) + '</b><span>tashkil etilgan</span></div>' +
      '<div class="stat"><b>' + val(c.stores) + '</b><span>filiallar</span></div>' +
      '<div class="stat"><b>' + val(c.staff) + '</b><span>xodimlar</span></div>' +
    '</div>' +
    '<div class="mission-box">' +
      '<div class="mission-title">Bizning missiyamiz</div>' +
      '<div class="mission-text">Texnologiyalarni ommalashtirib, hamma uchun qulaylik taqdim etamiz.</div>' +
    '</div>' +
    '<label style="margin-top:4px;margin-bottom:2px;">Bizning qadriyatlarimiz</label>' +
    '<div class="values-grid">' +
      '<div class="value-card"><div class="value-icon">❤️</div><div class="value-title">Mijozga samimiy g\'amxo\'rlik</div></div>' +
      '<div class="value-card"><div class="value-icon">🎯</div><div class="value-title">Intizom va natijadorlik</div></div>' +
      '<div class="value-card"><div class="value-icon">🛡️</div><div class="value-title">Halollik va axloqiylik</div></div>' +
      '<div class="value-card"><div class="value-icon">👥</div><div class="value-title">Jamoaviylik va birlik</div></div>' +
      '<div class="value-card"><div class="value-icon">⚖️</div><div class="value-title">Adolat va yagona qoidalar</div></div>' +
      '<div class="value-card"><div class="value-icon">📈</div><div class="value-title">Rivojlanish va professionallik</div></div>' +
    '</div>' +
    '<div class="actions"><button class="btn yellow" id="next">Anketaga o\'tish</button></div>');
  s.querySelector("#next").onclick = function () { go("form"); };
}

function renderForm() {
  var jobOptions = CONFIG.jobs.map(function(j) {
    return '<button type="button" class="chip job-chip" data-job="' + esc(j) + '" aria-pressed="' + (state.job === j) + '">' + esc(j) + '</button>';
  }).join('');

  var s = screen(
    '<h2>Anketa</h2>' +
    '<div class="field"><label>Qaysi vakansiya sizga qiziq?</label><div class="chips">' + jobOptions + '</div><div class="err" id="e-job"></div></div>' +
    '<div class="field"><label for="f-name">Ism va familiya</label><input id="f-name" type="text" autocomplete="name" placeholder="Ali Valiyev" value="' + esc(state.name) + '"><div class="err" id="e-name"></div></div>' +
    '<div class="field"><label for="f-age">Yoshingiz</label><input id="f-age" type="number" inputmode="numeric" min="16" max="70" placeholder="23" value="' + esc(state.age) + '"><div class="err" id="e-age"></div></div>' +
    '<div class="field"><label for="f-city">Yashash shahri / tumani</label><input id="f-city" type="text" autocomplete="address-level2" placeholder="Toshkent" value="' + esc(state.city) + '"><div class="err" id="e-city"></div></div>' +
    '<div class="field"><label for="f-phone">Telefon raqami</label><input id="f-phone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel" value="' + esc(state.phone) + '"><div class="err" id="e-phone"></div></div>' +
    '<div class="field"><label>Ish tajribangiz bormi?</label><div class="chips">' +
      '<button type="button" class="chip exp-chip" data-exp="Ha" aria-pressed="' + (state.exp === "Ha") + '">Ha, tajribam bor</button>' +
      '<button type="button" class="chip exp-chip" data-exp="Yo\'q" aria-pressed="' + (state.exp === "Yo'q") + '">Yo\'q, bu birinchi tajribam</button></div><div class="err" id="e-exp"></div></div>' +
    '<div class="field" id="place-wrap" ' + (state.exp === "Ha" ? "" : "hidden") + '><label for="f-place">Qayerda va qancha vaqt ishlagansiz?</label><input id="f-place" type="text" placeholder="Kompaniya va lavozim" value="' + esc(state.expPlace) + '"></div>' +
    '<div class="actions"><button class="btn yellow" id="next">Davom etish</button></div>');

  var jobChips = s.querySelectorAll(".job-chip");
  jobChips.forEach(function (ch) {
    ch.onclick = function () {
      state.job = ch.getAttribute("data-job");
      jobChips.forEach(function (x) { x.setAttribute("aria-pressed", String(x === ch)); });
      s.querySelector("#e-job").textContent = "";
    };
  });

  var expChips = s.querySelectorAll(".exp-chip");
  expChips.forEach(function (ch) {
    ch.onclick = function () {
      state.exp = ch.getAttribute("data-exp");
      expChips.forEach(function (x) { x.setAttribute("aria-pressed", String(x === ch)); });
      s.querySelector("#place-wrap").hidden = state.exp !== "Ha";
      s.querySelector("#e-exp").textContent = "";
    };
  });

  s.querySelector("#next").onclick = function () {
    var ok = true;
    function bad(id, msg) { s.querySelector("#" + id).textContent = msg; ok = false; }
    ["e-job", "e-name", "e-age", "e-city", "e-phone", "e-exp"].forEach(function (id) { s.querySelector("#" + id).textContent = ""; });
    
    var name = s.querySelector("#f-name").value.trim();
    var age = parseInt(s.querySelector("#f-age").value, 10);
    var city = s.querySelector("#f-city").value.trim();
    var phone = s.querySelector("#f-phone").value.trim();
    var digits = phone.replace(/\D/g, "");

    if (!state.job) bad("e-job", "Vakansiyani tanlang.");
    if (name.length < 3) bad("e-name", "Ism va familiyani to'liq yozing.");
    if (!(age >= 16 && age <= 70)) bad("e-age", "Yoshingizni raqam bilan yozing (16-70).");
    if (city.length < 2) bad("e-city", "Shahar/tuman nomini yozing.");
    if (digits.length < 9) bad("e-phone", "Telefon raqami noto'g'ri.");
    if (!state.exp) bad("e-exp", "Tanlovni kiriting.");
    if (!ok) return;

    state.name = name; state.age = age; state.city = city;
    state.phone = "+" + (digits.length === 9 ? "998" + digits : digits);
    state.expPlace = state.exp === "Ha" ? s.querySelector("#f-place").value.trim() : "";

    // Проверяем: выбор вопросов для вакансии
    if (state.job === "Sotuvchi-maslahatchi") {
      activeQuestions = QUESTIONS_SELLER;
      go("test-intro");
    } else if (state.job === "Kassir") {
      activeQuestions = QUESTIONS_CASHIER;
      go("test-intro");
    } else {
      activeQuestions = [];
      state.score = "Test yo'q";
      go("slot");
    }
  };
}

function renderTestIntro() {
  var s = screen(
    '<h2>' + esc(state.job) + ' lavozimi uchun test</h2>' +
    '<div class="stats" style="grid-template-columns:1fr 1fr">' +
      '<div class="stat"><b>' + activeQuestions.length + ' ta</b><span>savol</span></div>' +
      '<div class="stat"><b>' + CONFIG.testMinutes + ' daq</b><span>vaqt</span></div>' +
    '</div>' +
    '<p class="lead">Test savollariga javob bering. Boshlash tugmasini bosganingizdan so\'ng vaqt hisoblanadi.</p>' +
    '<div class="actions"><button class="btn yellow" id="next">Testni boshlash</button></div>');
  s.querySelector("#next").onclick = function () {
    state.q = 0; state.score = 0;
    state.deadline = Date.now() + CONFIG.testMinutes * 60000;
    go("test");
  };
}

function fmt(ms) {
  var t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

function renderTest() {
  main.innerHTML = "";
  var q = activeQuestions[state.q];
  var s = screen(
    '<div class="timer"><span class="step-label">Savol ' + (state.q + 1) + ' / ' + activeQuestions.length + '</span><span class="t" id="clock">' + fmt(state.deadline - Date.now()) + '</span></div>' +
    '<div class="qtext">' + esc(q[0]) + '</div>' +
    '<div class="opts" id="opts"></div>');
  var box = s.querySelector("#opts");
  q[1].forEach(function (text, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = text;
    b.onclick = function () {
      b.classList.add("picked");
      box.querySelectorAll(".opt").forEach(function (x) { x.disabled = true; });
      if (i === q[2]) state.score++;
      setTimeout(function () {
        state.q++;
        if (state.q >= activeQuestions.length) { stopTimer(); go("slot"); } else { renderTest(); animateTestBar(); }
      }, 200);
    };
    box.appendChild(b);
  });
  stopTimer();
  var clock = s.querySelector("#clock");
  state.timerId = setInterval(function () {
    var left = state.deadline - Date.now();
    clock.textContent = fmt(left);
    clock.classList.toggle("low", left < 60000);
    if (left <= 0) { stopTimer(); go("slot"); }
  }, 500);
}

function animateTestBar() {
  var pct = Math.round((state.step + state.q / activeQuestions.length) / (STEPS.length - 1) * 100);
  document.getElementById("barFill").style.width = pct + "%";
}

function renderSlot() {
  var s = screen(
    '<h2>Suhbat vaqtini tanlang</h2>' +
    '<p class="lead">Sizga qulay vaqt oralig\'ini belgilang.</p>' +
    '<div class="field"><label>Qulay vaqt oralig\'i</label><div class="chips" id="slots"></div><div class="err" id="e-slot"></div></div>' +
    '<div class="err" id="e-send"></div>' +
    '<div class="actions"><button class="btn yellow" id="next">Tasdiqlash va yuborish</button></div>');
  
  var box = s.querySelector("#slots");
  var next = s.querySelector("#next");

  CONFIG.timeSlots.forEach(function (slot) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.textContent = slot; b.setAttribute("aria-pressed", String(state.slot === slot));
    b.onclick = function () {
      state.slot = slot;
      box.querySelectorAll(".slot").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      s.querySelector("#e-slot").textContent = "";
    };
    box.appendChild(b);
  });

  next.onclick = function () {
    s.querySelector("#e-slot").textContent = "";

    if (!state.slot) {
      s.querySelector("#e-slot").textContent = "Vaqt oralig'ini tanlang.";
      return;
    }

    next.disabled = true; next.textContent = "Yuborilmoqda...";
    s.querySelector("#e-send").textContent = "";

    submit().then(function (ok) {
      if (ok) { go("done"); return; }
      next.disabled = false; next.textContent = "Qaytadan yuborish";
      s.querySelector("#e-send").textContent = "Yuborib bo'lmadi. Internetni tekshirib, qaytadan bosing.";
    });
  };
}

function payload() {
  if (!state.id) state.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var totalQuestions = activeQuestions.length || 10;
  return {
    id: state.id,
    job: state.job,
    name: state.name, age: state.age, city: state.city, phone: state.phone,
    exp: state.exp === "Ha" ? ("Ha: " + state.expPlace) : "Yo'q",
    score: typeof state.score === "number" ? (state.score + "/" + totalQuestions) : state.score, 
    slot: state.slot
  };
}

function submit() {
  var data = payload();
  if (CONFIG.endpoint) {
    var body = JSON.stringify(data);
    var headers = { "Content-Type": "text/plain;charset=utf-8" };
    return fetch(CONFIG.endpoint, { method: "POST", headers: headers, body: body })
      .then(function (r) { return r.json(); })
      .then(function (j) { return !!(j && j.ok); })
      .catch(function () {
        return fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", headers: headers, body: body })
          .then(function () { return true; }, function () { return false; });
      });
  }
  if (tg && typeof tg.sendData === "function") {
    try { tg.sendData(JSON.stringify(data)); } catch (e) {}
  }
  return Promise.resolve(true);
}

function renderDone() {
  var s = screen(
    '<div class="done">' +
    '<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
    '<h2>Rahmat, ' + esc(state.name.split(" ")[0]) + '!</h2>' +
    '<p class="lead">Anketangiz qabul qilindi. Tez orada siz bilan bog\'lanamiz!</p>' +
    '<div class="summary">' +
      '<span>Vakansiya</span><b>' + esc(state.job) + '</b>' +
      '<span style="margin-top:6px">Suhbat vaqti</span><b>' + esc(state.slot) + '</b>' +
      '<span style="margin-top:6px">Telefon</span><b>' + esc(state.phone) + '</b>' +
    '</div>' +
    '</div>');
}

go("welcome");
</script>
</body>
</html>
