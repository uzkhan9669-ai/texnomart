<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbc100">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Texnomart Ish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, one screen at a time, yellow header band with progress, big thumb-sized buttons at the bottom. */
:root {
  --yellow: #fbc100;
  --yellow-deep: #e0a900;
  --ink: #141414;
  --paper: #ffffff;
  --mist: #f4f2ec;
  --line: #e4e0d4;
  --mute: #6a665b;
  --ok: #1f8a4c;
  --bad: #c0392b;
  --display: "Unbounded", "Arial Black", sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0 10px;
}
.logo {
  font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -0.02em;
  background: var(--yellow); color: var(--ink); padding: 6px 12px; border-radius: 8px;
}
.step-label { font-size: 13px; font-weight: 600; color: var(--mute); }
.bar { height: 6px; background: var(--mist); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width .4s ease; }

main { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }
section.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; animation: slide .35s ease both; }
@keyframes slide { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

h1 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.12; letter-spacing: -0.03em; margin: 8px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.2; letter-spacing: -0.02em; margin: 6px 0 0; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--mute); }

.hero {
  background: var(--yellow); border-radius: 20px; padding: 22px 20px 20px; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -40px; bottom: -40px; width: 160px; height: 160px;
  border-radius: 50%; background: var(--ink); opacity: .08;
}
.hero h1 { margin-top: 0; }
.hero p { margin-top: 10px; font-weight: 600; }

.video-box { border-radius: 16px; overflow: hidden; background: var(--ink); aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; }
.video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-ph { color: #fff; text-align: center; padding: 16px; font-size: 14px; opacity: .85; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--mist); border-radius: 14px; padding: 14px 10px; text-align: center; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.stat span { display: block; font-size: 12px; color: var(--mute); font-weight: 600; margin-top: 2px; }
.points { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.points li { display: flex; gap: 12px; align-items: flex-start; }
.points li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 3px var(--ink) inset; }

label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 6px; }
input[type=text], input[type=tel], input[type=number] {
  width: 100%; font: inherit; padding: 14px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink);
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-color: var(--ink); }
.field { display: block; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 18px; margin-top: 4px; }
.chips { display: grid; gap: 10px; }
.chip, .opt, .slot {
  font: inherit; font-weight: 700; text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--paper); color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.chip:active, .opt:active, .slot:active { transform: scale(.985); }
.chip[aria-pressed=true], .slot[aria-pressed=true] { border-color: var(--ink); background: var(--yellow); }
.opt:hover, .slot:hover, .chip:hover { border-color: var(--ink); }
.opt.picked { border-color: var(--ink); background: var(--yellow); }

.btn {
  font: inherit; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: -0.01em;
  width: 100%; padding: 17px 20px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; cursor: pointer;
  transition: transform .1s, background .15s;
}
.btn:hover { background: #2c2c2c; }
.btn:active { transform: scale(.985); }
.btn.yellow { background: var(--yellow); color: var(--ink); }
.btn.yellow:hover { background: var(--yellow-deep); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.actions { margin-top: auto; padding-top: 8px; display: grid; gap: 10px; }
.note { font-size: 12.5px; color: var(--mute); }

.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .t { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 10px; }
.timer .t.low { background: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .65; } }
.qtext { font-size: 19px; font-weight: 800; line-height: 1.35; white-space: pre-line; text-wrap: balance; }
.opts { display: grid; gap: 10px; }

.done { text-align: center; align-items: center; justify-content: center; gap: 14px; }
.badge { width: 96px; height: 96px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
.badge svg { width: 48px; height: 48px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.summary { background: var(--mist); border-radius: 14px; padding: 14px 16px; width: 100%; text-align: left; display: grid; gap: 4px; }
.summary b { font-weight: 800; }
.preview-tag { font-size: 12px; background: var(--mist); border: 1px dashed var(--mute); color: var(--mute); border-radius: 10px; padding: 8px 10px; }

@media (prefers-reduced-motion: reduce) {
  section.screen, .badge, .timer .t.low { animation: none; }
  .bar > i, .btn, .chip, .opt, .slot { transition: none; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" id="logo">texnomart</div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <main id="main"></main>
</div>

<script>
/* ==================== SOZLAMALAR (sozlamalar) ==================== */
var CONFIG = {
  testMinutes: 5,
  // Kompaniya raqamlari: bo'sh qoldirilsa "—" ko'rinadi. To'g'ri raqamlarni shu yerga yozing.
  company: { year: "", stores: "", staff: "" },
  videoUrl: "IMG_2823.MP4",   // fayl index.html bilan bir papkada bo'lishi kerak
  slots: ["10-noyabr, 10:00", "10-noyabr, 11:00", "10-noyabr, 14:00", "11-noyabr, 10:00", "11-noyabr, 14:00"]
};

/* ==================== TEST SAVOLLARI (10 ta, faqat o'zbekcha) ==================== */
var QUESTIONS = [
  ["Tasavvur qiling, savdo zaliga mijoz kirdi. Xarakatlaringiz?", ["Unga etibor bermagandagiday ko'rsamam bo'laveradi", "Salomlashaman va yordam taklif qilaman", "Uning o'zini murojat qilishini kutaman"], 1],
  ["Olma belgisi bor brend qanday nomlanadi?", ["Xiaomi", "Samsung", "Apple", "HONOR"], 2],
  ["Bir metrda necha santimetr bor?", ["10 sm", "100 sm", "1000 sm"], 1],
  ["Mijoz changyutgich haqida so'rayapti, lekin siz uning xususiyatlarini bilmaysiz. Nima qilasiz?", ["O'ylab topaman, axmoq ko'rinmaslik uchun", "«Bilmayman» deyman", "«Biroz kutib turing, ma'lumotni aniqlab beraman» deyman"], 2],
  ["Ortiqcha so'zni toping:", ["Noutbuk", "Mikroto'lqinli pech", "Muzlatgich", "Kir yuvish mashinasi"], 0],
  ["To'g'ri ketma-ketlikni toping:\n3 – 6 – 12 – 24 – ?", ["28", "30", "48", "36"], 2],
  ["1 900 000 so'mdan 10% chegirma qilganda qancha qoladi?", ["320 000 so'm", "1 710 000 so'm", "2 090 000 so'm", "3 200 000 so'm"], 1],
  ["Qaysi biri mahsulot tavsifiga mos kelmaydi?\nTavsif: Televizor 55 dyuym, kafolat 2 yil, rangi qora, Smart-TV bor, HDMI — 3 ta port", ["Kafolat 2 yil", "HDMI — 2 ta port", "Rangi qora", "Smart-TV bor"], 1],
  ["Qaysi so'z ortiqcha:", ["Mashina", "Velosiped", "Samokat", "Karavot"], 3],
  ["Mijoz: «Sizlarda qimmat!» deydi. Qanday javob berasiz?", ["«Unda boshqa do'konga boring»", "«Biz eng yaxshi narx va sifat munosabatini taklif qilamiz»", "«Ha, qimmat lekin bu sizning aybingiz»"], 1]
];

/* ==================== HOLAT ==================== */
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var STEPS = ["welcome", "about", "form", "test-intro", "test", "slot", "done"];
var state = { step: 0, name: "", age: "", city: "", phone: "", exp: "", expPlace: "", q: 0, score: 0, deadline: 0, slot: "", timerId: null };
var main = document.getElementById("main");

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function val(v) { return v ? esc(v) : "—"; }

function go(name) {
  state.step = STEPS.indexOf(name);
  var screens = { welcome: renderWelcome, about: renderAbout, form: renderForm, "test-intro": renderTestIntro, test: renderTest, slot: renderSlot, done: renderDone };
  main.innerHTML = "";
  screens[name]();
  var pct = Math.round(state.step / (STEPS.length - 1) * 100);
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = name === "done" ? "" : (state.step + 1) + " / " + STEPS.length;
  window.scrollTo(0, 0);
}
function screen(html) { var s = document.createElement("section"); s.className = "screen"; s.innerHTML = html; main.appendChild(s); return s; }

/* ==================== EKRANLAR ==================== */
function renderWelcome() {
  var media = CONFIG.videoUrl
    ? '<div class="video-box"><video src="' + esc(CONFIG.videoUrl) + '" controls playsinline preload="metadata"></video></div>'
    : '<div class="video-box"><div class="video-ph">Bu yerda Texnomart haqida video bo\'ladi</div></div>';
  var s = screen(
    '<div class="hero"><h1>Texnomart jamoasiga xush kelibsiz</h1><p>Sotuvchi-maslahatchi lavozimi uchun qisqa anketa va test.</p></div>' +
    media +
    '<p class="lead">Avval kompaniya bilan tanishasiz, keyin anketa to\'ldirasiz va ' + QUESTIONS.length + ' ta savolli test topshirasiz. Oxirida suhbat uchun qulay vaqtni tanlaysiz.</p>' +
    '<div class="actions"><button class="btn yellow" id="next">Boshlash</button></div>');
  s.querySelector("#next").onclick = function () { go("about"); };
}

function renderAbout() {
  var c = CONFIG.company;
  var s = screen(
    '<h2>Texnomart haqida</h2>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + val(c.year) + '</b><span>tashkil topgan yil</span></div>' +
      '<div class="stat"><b>' + val(c.stores) + '</b><span>filiallar</span></div>' +
      '<div class="stat"><b>' + val(c.staff) + '</b><span>xodimlar</span></div>' +
    '</div>' +
    '<p>Texnomart maishiy texnika va elektronika sotuvi bo\'yicha O\'zbekistondagi yetakchi kompaniyalardan biri.</p>' +
    '<ul class="points"><li>Do\'stona jamoa va o\'qitish</li><li>Aniq grafik va halol baholash</li><li>O\'sish imkoniyati</li></ul>' +
    '<div class="actions"><button class="btn" id="next">Anketani to\'ldirish</button></div>' +
    '<p class="note">«Davom etish» tugmasini bosib, shaxsiy ma\'lumotlaringiz ishga qabul qilish maqsadida qayta ishlanishiga rozilik bildirasiz.</p>');
  s.querySelector("#next").onclick = function () { go("form"); };
}

function renderForm() {
  var s = screen(
    '<h2>Anketa</h2>' +
    '<div class="field"><label for="f-name">Ism va familiya</label><input id="f-name" type="text" autocomplete="name" value="' + esc(state.name) + '"><div class="err" id="e-name"></div></div>' +
    '<div class="field"><label for="f-age">Yoshingiz</label><input id="f-age" type="number" inputmode="numeric" min="16" max="70" value="' + esc(state.age) + '"><div class="err" id="e-age"></div></div>' +
    '<div class="field"><label for="f-city">Yashash shahri</label><input id="f-city" type="text" autocomplete="address-level2" value="' + esc(state.city) + '"><div class="err" id="e-city"></div></div>' +
    '<div class="field"><label for="f-phone">Telefon raqami</label><input id="f-phone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel" value="' + esc(state.phone) + '"><div class="err" id="e-phone"></div></div>' +
    '<div class="field"><label>Sotuvda ish tajribangiz bormi?</label><div class="chips">' +
      '<button type="button" class="chip" data-exp="Ha" aria-pressed="' + (state.exp === "Ha") + '">Ha</button>' +
      '<button type="button" class="chip" data-exp="Yo\'q" aria-pressed="' + (state.exp === "Yo'q") + '">Yo\'q, bu birinchi tajribam bo\'ladi</button></div><div class="err" id="e-exp"></div></div>' +
    '<div class="field" id="place-wrap" ' + (state.exp === "Ha" ? "" : "hidden") + '><label for="f-place">Qayerda va qancha vaqt ishlagansiz? Nima uchun ketgansiz?</label><input id="f-place" type="text" value="' + esc(state.expPlace) + '"></div>' +
    '<div class="actions"><button class="btn" id="next">Davom etish</button></div>');

  var chips = s.querySelectorAll(".chip");
  chips.forEach(function (ch) {
    ch.onclick = function () {
      state.exp = ch.getAttribute("data-exp");
      chips.forEach(function (x) { x.setAttribute("aria-pressed", String(x === ch)); });
      s.querySelector("#place-wrap").hidden = state.exp !== "Ha";
      s.querySelector("#e-exp").textContent = "";
    };
  });

  s.querySelector("#next").onclick = function () {
    var ok = true;
    function bad(id, msg) { s.querySelector("#" + id).textContent = msg; ok = false; }
    ["e-name", "e-age", "e-city", "e-phone", "e-exp"].forEach(function (id) { s.querySelector("#" + id).textContent = ""; });
    var name = s.querySelector("#f-name").value.trim();
    var age = parseInt(s.querySelector("#f-age").value, 10);
    var city = s.querySelector("#f-city").value.trim();
    var phone = s.querySelector("#f-phone").value.trim();
    var digits = phone.replace(/\D/g, "");
    if (name.length < 3) bad("e-name", "Ism va familiyani to'liq yozing.");
    if (!(age >= 16 && age <= 70)) bad("e-age", "Yoshingizni raqam bilan yozing (16 dan 70 gacha).");
    if (city.length < 2) bad("e-city", "Shahar nomini yozing.");
    if (digits.length < 9) bad("e-phone", "Raqam noto'g'ri. Masalan: +998901234567");
    if (!state.exp) bad("e-exp", "Birini tanlang.");
    if (!ok) return;
    state.name = name; state.age = age; state.city = city;
    state.phone = "+" + (digits.length === 9 ? "998" + digits : digits);
    state.expPlace = state.exp === "Ha" ? s.querySelector("#f-place").value.trim() : "";
    go("test-intro");
  };
}

function renderTestIntro() {
  var s = screen(
    '<h2>Smekalka testi</h2>' +
    '<div class="stats" style="grid-template-columns:1fr 1fr">' +
      '<div class="stat"><b>' + QUESTIONS.length + '</b><span>savol</span></div>' +
      '<div class="stat"><b>' + CONFIG.testMinutes + ' daq</b><span>vaqt</span></div>' +
    '</div>' +
    '<p>Har bir savolda bitta javobni tanlang. Tugmani bosganingizdan keyin vaqt hisoblanadi va uni to\'xtatib bo\'lmaydi.</p>' +
    '<div class="actions"><button class="btn yellow" id="next">Testni boshlash</button></div>');
  s.querySelector("#next").onclick = function () {
    state.q = 0; state.score = 0;
    state.deadline = Date.now() + CONFIG.testMinutes * 60000;
    go("test");
  };
}

function fmt(ms) {
  var t = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

function renderTest() {
  main.innerHTML = "";
  var q = QUESTIONS[state.q];
  var s = screen(
    '<div class="timer"><span class="step-label">Savol ' + (state.q + 1) + ' / ' + QUESTIONS.length + '</span><span class="t" id="clock">' + fmt(state.deadline - Date.now()) + '</span></div>' +
    '<div class="qtext">' + esc(q[0]) + '</div>' +
    '<div class="opts" id="opts"></div>');
  var box = s.querySelector("#opts");
  q[1].forEach(function (text, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = text;
    b.onclick = function () {
      b.classList.add("picked");
      box.querySelectorAll(".opt").forEach(function (x) { x.disabled = true; });
      if (i === q[2]) state.score++;
      setTimeout(function () {
        state.q++;
        if (state.q >= QUESTIONS.length) { stopTimer(); go("slot"); } else { renderTest(); animateTestBar(); }
      }, 220);
    };
    box.appendChild(b);
  });
  stopTimer();
  var clock = s.querySelector("#clock");
  state.timerId = setInterval(function () {
    var left = state.deadline - Date.now();
    clock.textContent = fmt(left);
    clock.classList.toggle("low", left < 60000);
    if (left <= 0) { stopTimer(); go("slot"); }
  }, 500);
}
function animateTestBar() {
  var pct = Math.round((state.step + state.q / QUESTIONS.length) / (STEPS.length - 1) * 100);
  document.getElementById("barFill").style.width = pct + "%";
}

function renderSlot() {
  var s = screen(
    '<h2>Suhbat vaqtini tanlang</h2>' +
    '<p class="lead">Test yakunlandi. Sizga qulay vaqtni belgilang, biz telefon orqali bog\'lanamiz.</p>' +
    '<div class="chips" id="slots"></div>' +
    '<div class="actions"><button class="btn yellow" id="next" disabled>Tasdiqlash</button></div>');
  var box = s.querySelector("#slots"), next = s.querySelector("#next");
  CONFIG.slots.forEach(function (slot) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.textContent = slot; b.setAttribute("aria-pressed", "false");
    b.onclick = function () {
      state.slot = slot;
      box.querySelectorAll(".slot").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      next.disabled = false;
    };
    box.appendChild(b);
  });
  next.onclick = function () { submit(); go("done"); };
}

function payload() {
  return {
    name: state.name, age: state.age, city: state.city, phone: state.phone,
    exp: state.exp === "Ha" ? ("Ha: " + state.expPlace) : "Yo'q",
    score: state.score + "/" + QUESTIONS.length, slot: state.slot
  };
}
function submit() {
  if (tg && typeof tg.sendData === "function") {
    try { tg.sendData(JSON.stringify(payload())); } catch (e) {}
  }
}

function renderDone() {
  var inTg = !!tg;
  var s = screen(
    '<div class="done" style="display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0">' +
    '<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
    '<h2>Rahmat, ' + esc(state.name.split(" ")[0]) + '!</h2>' +
    '<p class="lead">Javoblaringiz qabul qilindi. Texnomartda uchrashguncha!</p>' +
    '<div class="summary"><span>Suhbat vaqti</span><b>' + esc(state.slot) + '</b><span style="margin-top:6px">Telefon</span><b>' + esc(state.phone) + '</b></div>' +
    (inTg ? "" : '<div class="preview-tag">Ko\'rib chiqish rejimi: ma\'lumot Telegram botga yuborilmadi. Telegram ichida ochilganda jadvalga yoziladi.</div>') +
    '</div>');
}

go("welcome");
</script>
</body>
</html>
